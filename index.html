<!doctype html>
<html lang="sv" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover krävs för att env(safe-area-inset-*) ska ge
         värden skilda från noll. Utan den hamnar bottennavigeringen bakom
         iPhones hemindikator och blir oklickbar. Se PLAN.md §2.3. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />

    <!-- iOS läser hemskärmsikonen härifrån, inte ur manifestet. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />

    <title>Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
